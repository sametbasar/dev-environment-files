set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
# set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
# WezTerm temasıyla uyumlu renkler
# bg=#011423, fg=#CBE0F0, green=#44FFB1, cyan=#24EAF7, purple=#a277ff

# Genel
set -g status-style "bg=#011423,fg=#CBE0F0"
set -g status-interval 1
set -g status-position bottom

# Sol: session adı
set -g status-left-length 40
set -g status-left "#[bg=#44FFB1,fg=#011423,bold] #S #[bg=#011423,fg=#44FFB1] "

# Sağ: tarih ve saat
set -g status-right-length 80
set -g status-right "#[fg=#627E97] %Y-%m-%d #[fg=#CBE0F0] #[fg=#24EAF7]%H:%M #[bg=#a277ff,fg=#011423,bold] #H "

# Pencere listesi
set -g window-status-format "#[fg=#627E97] #I  #W "
set -g window-status-current-format "#[bg=#143652,fg=#CBE0F0,bold] #I  #W "
set -g window-status-separator ""

# Pane border
set -g pane-border-style "fg=#214969"
set -g pane-active-border-style "fg=#44FFB1"

# Mesaj renkleri
set -g message-style "bg=#143652,fg=#CBE0F0"
set -g message-command-style "bg=#143652,fg=#CBE0F0"

# Kopyalama modu
set -g mode-style "bg=#0A64AC,fg=#CBE0F0"

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
